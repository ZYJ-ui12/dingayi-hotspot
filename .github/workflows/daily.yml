name: dingayi-hotspot-daily

on:
  # ⚠️ 当前以本地定时任务为每日更新主力（用户选择"先用本地的"）。
  # 切换到线上自动更新时：取消下面 schedule 块的注释，并停用本地定时任务，避免两边同时推送。
  # schedule:
  #   # 北京时间 10:00 = UTC 02:00
  #   - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dingayi-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      ARK_MODEL: ${{ secrets.ARK_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查 API Key（未配置则跳过本次，等待配置）
        if: env.ARK_API_KEY == ''
        run: echo "ARK_API_KEY 尚未配置，本次更新跳过（不会报错）。请在仓库 Settings->Secrets 添加。" && exit 0

      - name: 抓取抖音/小红书双平台热榜
        run: python scripts/fetch_hot.py

      - name: 生成博主借势建议（方舟 LLM，编导视角）
        run: python scripts/llm_advise.py

      - name: 构建博主看板 HTML
        run: python scripts/build.py

      - name: 保存历史数据快照（用于热点生命周期追踪）
        run: |
          mkdir -p history
          cp hotdata.json history/$(date +%F).json
          echo "已保存历史快照: history/$(date +%F).json"

      - name: 提交并推送
        run: |
          git config user.name "dingayi-bot"
          git config user.email "dingayi-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无内容变化，跳过提交"
          else
            git commit -m "daily update: $(date +%F)"
            git push
            echo "已推送每日更新"
          fi

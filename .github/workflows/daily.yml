name: dingayi-hotspot-daily

on:
  # 定时自动更新：北京时间 10:00 / 15:00（UTC 2:00 / 7:00）
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 7 * * *'

permissions:
  contents: write

concurrency:
  group: dingayi-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      ARK_MODEL: ${{ secrets.ARK_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取抖音/小红书双平台热榜
        run: python scripts/fetch_hot.py

      - name: 生成博主借势建议（方舟 LLM，编导视角）
        run: python scripts/llm_advise.py

      # 记录必须在构建之前：构建时读取 update-history.json，本次时间才能立即显示在页面
      - name: 记录本次更新时间（页面展示最近 12 条）
        run: |
          python - <<'PY'
          import json, os, datetime
          LOG = 'update-history.json'
          data = []
          if os.path.exists(LOG):
              try:
                  data = json.load(open(LOG, encoding='utf-8'))
                  if not isinstance(data, list):
                      data = []
              except Exception:
                  data = []
          data.append({
              'time': datetime.datetime.now().strftime('%Y-%m-%d %H:%M'),
              'type': 'auto',
          })
          data = data[-60:]  # 最多保留 60 条
          json.dump(data, open(LOG, 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print('recorded update:', data[-1])
          PY

      - name: 构建博主看板 HTML
        run: python scripts/build.py

      - name: 保存历史数据快照（用于热点生命周期追踪）
        run: |
          mkdir -p history
          cp hotdata.json history/$(date +%F).json
          echo "已保存历史快照: history/$(date +%F).json"

      - name: 提交并推送
        run: |
          git config user.name "dingayi-bot"
          git config user.email "dingayi-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无内容变化，跳过提交"
          else
            git commit -m "daily update: $(date +%F)"
            # -X ours：本地全量推送与本次更新冲突时，以本次工作流数据为准（热榜/建议/记录）
            git pull --rebase -X ours origin main
            git push
            echo "已推送每日更新"
          fi
